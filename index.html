<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening StayLocked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .status {
            color: #b0b0b0;
            font-size: 16px;
            margin-bottom: 30px;
            min-height: 24px;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 20px;
            display: none;
        }
        
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔒</div>
        <h1>Opening StayLocked</h1>
        <div class="spinner"></div>
        <p class="status">Please wait...</p>
        <div class="error-message" id="errorMessage">
            <p>If the app didn't open, click below to download it from the App Store.</p>
        </div>
        <button class="button" id="fallbackButton" style="display: none;">
            Download from App Store
        </button>
    </div>

    <script>
        // Configuration
        const APP_STORE_URL = 'https://apps.apple.com/us/app/staylocked/id6760554025';
        const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.staylocked.app';
        const DEEP_LINK_SCHEME = 'staylocked://reset-password';
        const TIMEOUT_MS = 2500; // 2.5 seconds

        // Get URL parameters
        function getUrlParams() {
            const url = new URL(window.location.href);
            const params = new URLSearchParams(url.search);
            
            // Build query string from all parameters
            let queryString = '';
            for (const [key, value] of params) {
                queryString += (queryString ? '&' : '?') + key + '=' + encodeURIComponent(value);
            }
            
            return queryString;
        }

        // Detect if user is on iOS or Android
        function getStoreLink() {
            const userAgent = navigator.userAgent.toLowerCase();
            const isIOS = /iphone|ipad|ipod/.test(userAgent);
            const isAndroid = /android/.test(userAgent);
            
            if (isAndroid) {
                return PLAY_STORE_URL;
            }
            return APP_STORE_URL;
        }

        // Try to open the app
        function tryOpenApp() {
            const params = getUrlParams();
            const deepLink = DEEP_LINK_SCHEME + params;
            
            console.log('Attempting to open:', deepLink);
            
            // Try to open the deep link
            window.location.href = deepLink;
            
            // If app didn't open, show fallback after timeout
            setTimeout(showFallback, TIMEOUT_MS);
        }

        // Show fallback button if app didn't open
        function showFallback() {
            const statusEl = document.querySelector('.status');
            const errorEl = document.getElementById('errorMessage');
            const buttonEl = document.getElementById('fallbackButton');
            const storeLink = getStoreLink();
            
            // Update UI
            statusEl.textContent = 'App not found';
            errorEl.style.display = 'block';
            buttonEl.style.display = 'inline-block';
            buttonEl.href = storeLink;
            
            // Actually redirect after showing for a moment
            setTimeout(() => {
                window.location.href = storeLink;
            }, 3000);
        }

        // Start the process
        window.addEventListener('load', tryOpenApp);
    </script>
</body>
</html>
